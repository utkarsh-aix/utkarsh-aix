name: Update GitHub Stats and Contribution Graph

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Prevent recursive triggers from the auto-commit push.
concurrency:
  group: stats-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Checkout with the default GITHUB_TOKEN.
      # If GH_PAT is set it will be used by the script for richer data,
      # but checkout itself always uses the built-in token for reliability.
      # -----------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -----------------------------------------------------------------------
      # Pre-flight: report environment so failures are immediately visible
      # -----------------------------------------------------------------------
      - name: Pre-flight Diagnostics
        run: |
          echo "===================================================="
          echo "Run timestamp  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Runner OS      : $RUNNER_OS"
          echo "Python version : $(python --version)"
          echo "Repository     : $GITHUB_REPOSITORY"
          echo "Branch         : $GITHUB_REF_NAME"
          if [ -n "$GH_PAT_SET" ]; then
            echo "GH_PAT present : YES (private contributions will be counted)"
          else
            echo "GH_PAT present : NO (only public contributions visible)"
            echo "               Add GH_PAT secret (scopes: read:user, repo) for full data."
          fi
          echo "===================================================="
          echo ""
          echo "[README REFS CHECK]"
          grep -o 'src="[^"]*assets[^"]*"' README.md || echo "(no asset srcs found)"
        env:
          GH_PAT_SET: ${{ secrets.GH_PAT }}

      # -----------------------------------------------------------------------
      # Generate the SVGs.
      # GH_PAT is passed separately so the script can distinguish it from
      # the built-in GITHUB_TOKEN and log accordingly.
      # If GH_PAT is not set, the script falls through to GITHUB_TOKEN,
      # which works for public data.
      # -----------------------------------------------------------------------
      - name: Generate GitHub Stats SVGs
        env:
          GITHUB_USERNAME: 'utkarsh-aix'
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_github_stats.py

      # -----------------------------------------------------------------------
      # Verify outputs exist before committing
      # -----------------------------------------------------------------------
      - name: Verify Generated Assets
        run: |
          echo "[ASSET VERIFICATION]"
          all_ok=true
          for f in assets/github-stats.svg assets/github-languages.svg assets/github-streak.svg assets/github-activity.svg; do
            if [ -f "$f" ]; then
              echo "  [OK]    $f  ($(wc -c < "$f") bytes)"
            else
              echo "  [ERROR] $f -- FILE MISSING"
              all_ok=false
            fi
          done
          if [ "$all_ok" = "false" ]; then exit 1; fi

      # -----------------------------------------------------------------------
      # Commit only when content changed
      # -----------------------------------------------------------------------
      - name: Commit and Push Updated Assets
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --staged --quiet; then
            echo "[COMMIT] No changes detected in assets/ -- skipping commit."
            echo "         This is expected when data has not changed since the last run."
          else
            echo "[COMMIT] Changes detected -- committing updated assets."
            git diff --staged --stat
            git commit -m "chore(stats): auto-update GitHub stats and contribution graph [skip ci]"
            git push origin HEAD
            echo "[COMMIT] Push complete."
          fi
