<svg xmlns="http://www.w3.org/2000/svg" width="495" height="205" viewBox="0 0 495 205" fill="none">
  <style>
    .card-bg { fill: #0D1117; stroke: #7B61FF; stroke-width: 1.5; rx: 10px; }
    .title { font-family: JetBrains Mono, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #00FFA3; }
    .lang-text { font-family: JetBrains Mono, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <rect width="493" height="203" x="1" y="1" class="card-bg"/>

  <!-- Title -->
  <g transform="translate(25, 30)">
    <text x="0" y="10" class="title">Most Used Languages</text>
  </g>

  <!-- Progress Bar -->
  
    <g transform="translate(25, 60)">
      <mask id="bar-mask">
        <rect width="445" height="8" rx="4" fill="#FFFFFF"/>
      </mask>
      <rect width="445" height="8" rx="4" fill="#21262D"/>
      <g mask="url(#bar-mask)">
        <rect x="0.0" y="0" width="388.7" height="8" fill="#3572A5"/><rect x="388.7" y="0" width="29.8" height="8" fill="#F1E05A"/><rect x="418.5" y="0" width="13.9" height="8" fill="#555555"/><rect x="432.4" y="0" width="8.1" height="8" fill="#FED10A"/><rect x="440.5" y="0" width="2.3" height="8" fill="#F34B7D"/><rect x="442.8" y="0" width="2.2" height="8" fill="#E4CC98"/>
      </g>
    </g>
    

  <!-- Languages Legend (2 Columns) -->
  
        <g transform="translate(25, 95)">
          <circle cx="5" cy="5" r="4.5" fill="#3572A5"/>
          <text x="18" y="9" class="lang-text">Python 87.34%</text>
        </g>
        
        <g transform="translate(245, 95)">
          <circle cx="5" cy="5" r="4.5" fill="#F1E05A"/>
          <text x="18" y="9" class="lang-text">JavaScript 6.70%</text>
        </g>
        
        <g transform="translate(25, 123)">
          <circle cx="5" cy="5" r="4.5" fill="#555555"/>
          <text x="18" y="9" class="lang-text">C 3.12%</text>
        </g>
        
        <g transform="translate(245, 123)">
          <circle cx="5" cy="5" r="4.5" fill="#FED10A"/>
          <text x="18" y="9" class="lang-text">Cython 1.83%</text>
        </g>
        
        <g transform="translate(25, 151)">
          <circle cx="5" cy="5" r="4.5" fill="#F34B7D"/>
          <text x="18" y="9" class="lang-text">C++ 0.52%</text>
        </g>
        
        <g transform="translate(245, 151)">
          <circle cx="5" cy="5" r="4.5" fill="#E4CC98"/>
          <text x="18" y="9" class="lang-text">Tcl 0.49%</text>
        </g>
        
</svg>