<svg xmlns="http://www.w3.org/2000/svg" width="495" height="205" viewBox="0 0 495 205" fill="none">
  <style>
    .card-bg { fill: #0D1117; stroke: #7B61FF; stroke-width: 1.5; rx: 10px; }
    .title { font-family: JetBrains Mono, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #00FFA3; }
    .lang-text { font-family: JetBrains Mono, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <rect width="493" height="203" x="1" y="1" class="card-bg"/>

  <!-- Title -->
  <g transform="translate(25, 30)">
    <text x="0" y="10" class="title">Most Used Languages</text>
  </g>

  <!-- Progress Bar -->
  <g transform="translate(25, 65)">
    <clipPath id="bar-clip">
      <rect width="445" height="8" rx="4"/>
    </clipPath>
    <g clip-path="url(#bar-clip)">
      <rect x="0.0" y="0" width="348.9" height="8" fill="#3572A5"/>
    <rect x="348.9" y="0" width="63.2" height="8" fill="#DA5B0B"/>
    <rect x="412.1" y="0" width="18.2" height="8" fill="#E34C26"/>
    <rect x="430.3" y="0" width="9.3" height="8" fill="#563D7C"/>
    <rect x="439.7" y="0" width="5.3" height="8" fill="#F1E05A"/>
    </g>
  </g>

  <!-- Languages List (2 Columns) -->
  <g transform="translate(25, 95)">

      <g transform="translate(0, 0)">
        <circle cx="5" cy="6" r="5" fill="#3572A5"/>
        <text x="18" y="10" class="lang-text">Python</text>
        <text x="190" y="10" class="lang-text" style="font-weight: 500; fill: #8B949E; text-anchor: end;">78.4%</text>
      </g>

      <g transform="translate(220, 0)">
        <circle cx="5" cy="6" r="5" fill="#DA5B0B"/>
        <text x="18" y="10" class="lang-text">Jupyter Notebook</text>
        <text x="190" y="10" class="lang-text" style="font-weight: 500; fill: #8B949E; text-anchor: end;">14.2%</text>
      </g>

      <g transform="translate(0, 26)">
        <circle cx="5" cy="6" r="5" fill="#E34C26"/>
        <text x="18" y="10" class="lang-text">HTML</text>
        <text x="190" y="10" class="lang-text" style="font-weight: 500; fill: #8B949E; text-anchor: end;">4.1%</text>
      </g>

      <g transform="translate(220, 26)">
        <circle cx="5" cy="6" r="5" fill="#563D7C"/>
        <text x="18" y="10" class="lang-text">CSS</text>
        <text x="190" y="10" class="lang-text" style="font-weight: 500; fill: #8B949E; text-anchor: end;">2.1%</text>
      </g>

      <g transform="translate(0, 52)">
        <circle cx="5" cy="6" r="5" fill="#F1E05A"/>
        <text x="18" y="10" class="lang-text">JavaScript</text>
        <text x="190" y="10" class="lang-text" style="font-weight: 500; fill: #8B949E; text-anchor: end;">1.2%</text>
      </g>
  </g>
</svg>